version: '3.8'

services:
  cvm_runner:
    image: robortyan/nearai_cvm_runner:latest
    platform: linux/amd64
    ports:
      - "8001:443"
      # - "8002:443"
      # - "8003:443"
    environment:
      RUNNER_API_KEY: ${RUNNER_API_KEY:-"custom-local-runner"}
      DD_APM_ENABLED: false
      DD_LOGS_ENABLED: false
      ACCOUNT_ID: ${ACCOUNT_ID}
      USE_AGENT_CACHE: ${USE_AGENT_CACHE:-true}
    restart: unless-stopped
    deploy:
      # replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
